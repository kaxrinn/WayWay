$kind: http-request
name: 'Subscribe Paket'
method: POST
url: '{{base_url}}/pemilik/paket/{{paket_id}}/checkout'
order: 8000
headers:
  - key: Accept
    value: 'application/json'
  - key: X-CSRF-TOKEN
    value: '{{csrf_token}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "subscription_package_id": "{{subscription_package_id}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Subscription initiated", function() {
          pm.expect(pm.response.code).to.be.oneOf([200, 201, 302, 404, 422]);
      });
      if (pm.response.code === 200 || pm.response.code === 201) {
          const json = pm.response.json();
          if (json && json.transaction_id) {
              pm.environment.set("transaksi_id", json.transaction_id);
          }
      }
