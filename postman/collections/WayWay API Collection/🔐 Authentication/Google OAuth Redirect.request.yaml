$kind: http-request
name: 'Google OAuth Redirect'
method: GET
url: '{{base_url}}/auth/google'
order: 9800
headers:
  - key: Accept
    value: 'text/html'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Google OAuth redirect returns 302", function() {
          pm.expect(pm.response.code).to.be.oneOf([200, 302]);
      });
