$kind: http-request
name: 'Forgot Password'
method: POST
url: '{{base_url}}/forgot-password'
order: 7000
headers:
  - key: Accept
    value: 'application/json'
  - key: X-CSRF-TOKEN
    value: '{{csrf_token}}'
body:
  type: urlencoded
  content:
    - key: email
      value: '{{wisatawan_email}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Forgot password returns 200 or 422", function() {
          pm.expect(pm.response.code).to.be.oneOf([200, 302, 422]);
      });
