$kind: http-request
name: 'Register'
method: POST
url: '{{base_url}}/register'
order: 1000
headers:
  - key: Accept
    value: 'application/json'
  - key: X-CSRF-TOKEN
    value: '{{csrf_token}}'
body:
  type: urlencoded
  content:
    - key: name
      value: 'Test Wisatawan'
    - key: email
      value: '{{wisatawan_email}}'
    - key: password
      value: '{{wisatawan_password}}'
    - key: password_confirmation
      value: '{{wisatawan_password}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Register returns 200, 302, or 422", function() {
          pm.expect(pm.response.code).to.be.oneOf([200, 302, 422]);
      });
      if (pm.response.code === 422) {
          pm.test("Validation errors returned", function() {
              const json = pm.response.json();
              pm.expect(json).to.have.property('errors');
          });
      }
