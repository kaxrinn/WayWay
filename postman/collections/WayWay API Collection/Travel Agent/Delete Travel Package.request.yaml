$kind: http-request
name: 'Delete Travel Package'
method: DELETE
url: '{{base_url}}/travel-agent/packages/{{travel_package_id}}'
order: 5000
headers:
  - key: X-CSRF-TOKEN
    value: '{{csrf_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Travel package deleted", function() {
          pm.expect(pm.response.code).to.be.oneOf([200, 204, 302, 403, 404]);
      });
