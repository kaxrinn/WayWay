$kind: http-request
name: 'Travel Agent Profil'
method: GET
url: '{{base_url}}/travel-agent/dashboard'
order: 8000
headers:
  - key: Accept
    value: 'text/html'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Profil loads", function() {
          pm.expect(pm.response.code).to.be.oneOf([200, 302, 403]);
      });
