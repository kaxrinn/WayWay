$kind: http-request
name: 'Partner Form'
method: GET
url: '{{base_url}}/partner'
order: 8000
headers:
  - key: Accept
    value: 'text/html'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Partner form loads", function() {
          pm.expect(pm.response.code).to.be.oneOf([200, 302]);
      });
