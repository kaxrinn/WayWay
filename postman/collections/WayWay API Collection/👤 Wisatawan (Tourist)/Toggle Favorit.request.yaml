$kind: http-request
name: 'Toggle Favorit'
method: POST
url: '{{base_url}}/favorit/toggle'
order: 4000
headers:
  - key: Accept
    value: 'application/json'
  - key: X-CSRF-TOKEN
    value: '{{csrf_token}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "destinasi_id": "{{destinasi_id}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Toggle favorit returns 200 or 419", function() {
          pm.expect(pm.response.code).to.be.oneOf([200, 419]);
      });
      if (pm.response.code === 200) {
          pm.test("Response has status", function() {
              const json = pm.response.json();
              pm.expect(json).to.have.property('status');
          });
      }
