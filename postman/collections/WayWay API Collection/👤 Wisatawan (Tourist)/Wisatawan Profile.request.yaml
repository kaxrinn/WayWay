$kind: http-request
name: 'Wisatawan Profile'
method: GET
url: '{{base_url}}/wisatawan/profil'
order: 2000
headers:
  - key: Accept
    value: 'text/html'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Profile page loads", function() {
          pm.expect(pm.response.code).to.be.oneOf([200, 302]);
      });
