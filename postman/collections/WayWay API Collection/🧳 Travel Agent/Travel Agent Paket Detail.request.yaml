$kind: http-request
name: 'Travel Agent Paket Detail'
method: GET
url: '{{base_url}}/travel-agent/packages/{{paket_id}}'
order: 9000
headers:
  - key: Accept
    value: 'text/html'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Package detail loads", function() {
          pm.expect(pm.response.code).to.be.oneOf([200, 302, 404]);
      });
