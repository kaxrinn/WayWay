$kind: http-request
name: 'Travel Agent Dashboard'
method: GET
url: '{{base_url}}/travel-agent/dashboard'
order: 1000
headers:
  - key: Accept
    value: 'text/html'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Dashboard loads", function() {
          pm.expect(pm.response.code).to.be.oneOf([200, 302]);
      });
