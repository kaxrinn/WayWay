$kind: http-request
name: 'Travel Agent Subscription'
method: GET
url: '{{base_url}}/travel-agent/subscription'
order: 6000
headers:
  - key: Accept
    value: 'text/html'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Subscription page loads", function() {
          pm.expect(pm.response.code).to.be.oneOf([200, 302]);
      });
