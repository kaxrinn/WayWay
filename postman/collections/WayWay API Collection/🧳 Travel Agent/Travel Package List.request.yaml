$kind: http-request
name: 'Travel Package List'
method: GET
url: '{{base_url}}/travel-agent/packages'
order: 2000
headers:
  - key: Accept
    value: 'text/html'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Package list loads", function() {
          pm.expect(pm.response.code).to.be.oneOf([200, 302, 403]);
      });
