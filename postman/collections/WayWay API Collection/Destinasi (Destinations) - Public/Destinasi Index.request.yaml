$kind: http-request
name: 'Destinasi Index'
method: GET
url: '{{base_url}}/destinasi'
order: 1000
headers:
  - key: Accept
    value: 'text/html'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Destinasi index loads", function() {
          pm.expect(pm.response.code).to.be.oneOf([200, 302]);
      });
      pm.test("Response is HTML", function() {
          pm.expect(pm.response.headers.get('Content-Type')).to.include('text/html');
      });
