$kind: collection
name: 'WayWay - Tourism Platform API'
description: |-
  # WayWay Tourism Platform API

  Complete API collection for the WayWay Laravel-based tourism platform.
  Covers all roles: Wisatawan (Tourist), Pemilik Wisata (Tourism Owner), Travel Agent, and Admin.

  ## Roles
  - **Wisatawan** — Browse destinations, manage favorites, create itineraries, chat with Waybot AI
  - **Pemilik Wisata** — Manage tourism destinations, submit edit requests, manage subscriptions
  - **Travel Agent** — Create and manage travel packages, manage subscriptions
  - **Admin** — Full platform management: users, destinations, categories, subscriptions, transactions

  ## Authentication
  This platform uses Laravel session-based authentication with CSRF token protection.
  Run the Login request first to obtain a session cookie and CSRF token.

  ## Variables
  Set `base_url` to your local or production server URL.

variables:
  - key: base_url
    value: 'http://127.0.0.1:8000'
  - key: wisatawan_email
    value: 'wisatawan@test.com'
  - key: wisatawan_password
    value: 'Password123'
  - key: admin_email
    value: 'admin@wayway.com'
  - key: admin_password
    value: 'Password123'
  - key: pemilik_email
    value: 'pemilik@test.com'
  - key: pemilik_password
    value: 'Password123'
  - key: travel_agent_email
    value: 'agent@test.com'
  - key: travel_agent_password
    value: 'Password123'
  - key: csrf_token
    value: ''
  - key: waybot_session_token
    value: ''
  - key: destinasi_id
    value: '1'
  - key: kategori_id
    value: '1'
  - key: paket_id
    value: '2'
  - key: transaksi_id
    value: '1'
  - key: edit_request_id
    value: '1'
  - key: itinerary_history_id
    value: '1'
  - key: travel_package_id
    value: '1'
  - key: subscription_package_id
    value: '1'
  - key: midtrans_signature
    value: ''

scripts:
  - type: http:beforeRequest
    language: text/javascript
    code: |-
      // Auto-set CSRF token from cookie if available
      const cookies = pm.cookies.toObject();
      if (cookies['XSRF-TOKEN']) {
          const decoded = decodeURIComponent(cookies['XSRF-TOKEN']);
          pm.collectionVariables.set('csrf_token', decoded);
          pm.request.headers.upsert({
              key: 'X-CSRF-TOKEN',
              value: decoded
          });
      }
