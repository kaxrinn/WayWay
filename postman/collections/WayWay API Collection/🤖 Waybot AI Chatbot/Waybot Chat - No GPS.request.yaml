$kind: http-request
name: 'Waybot Chat - No GPS'
method: POST
url: '{{base_url}}/waybot/chat'
order: 2000
headers:
  - key: Accept
    value: 'application/json'
  - key: X-CSRF-TOKEN
    value: '{{csrf_token}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "message": "Apa saja destinasi wisata populer?",
      "session_token": "{{waybot_session_token}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Waybot responds successfully", function() {
          pm.expect(pm.response.code).to.be.oneOf([200, 419]);
      });
      if (pm.response.code === 200) {
          pm.test("Response is JSON", function() {
              pm.expect(pm.response.headers.get('Content-Type')).to.include('application/json');
          });
          pm.test("Response has success field", function() {
              const json = pm.response.json();
              pm.expect(json).to.have.property('success');
          });
          pm.test("Response has session_token", function() {
              const json = pm.response.json();
              if (json.session_token) {
                  pm.environment.set("waybot_session_token", json.session_token);
              }
          });
      }
