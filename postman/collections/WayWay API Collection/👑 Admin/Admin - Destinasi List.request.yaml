$kind: http-request
name: 'Admin - Destinasi List'
method: GET
url: '{{base_url}}/admin/destinasi'
order: 4000
headers:
  - key: Accept
    value: 'text/html'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Admin destinasi list loads", function() {
          pm.expect(pm.response.code).to.be.oneOf([200, 302]);
      });
