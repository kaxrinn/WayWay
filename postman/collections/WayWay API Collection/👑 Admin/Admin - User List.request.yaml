$kind: http-request
name: 'Admin - User List'
method: GET
url: '{{base_url}}/admin/users'
order: 2000
headers:
  - key: Accept
    value: 'text/html'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("User list loads", function() {
          pm.expect(pm.response.code).to.be.oneOf([200, 302]);
      });
