$kind: http-request
name: 'Admin - Reject Destinasi'
method: POST
url: '{{base_url}}/admin/destinasi/{{destinasi_id}}/reject'
order: 6000
headers:
  - key: Accept
    value: 'application/json'
  - key: X-CSRF-TOKEN
    value: '{{csrf_token}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "alasan": "Informasi destinasi tidak lengkap"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Destinasi rejected", function() {
          pm.expect(pm.response.code).to.be.oneOf([200, 302]);
      });
