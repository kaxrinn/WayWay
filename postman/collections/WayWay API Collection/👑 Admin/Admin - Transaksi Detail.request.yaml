$kind: http-request
name: 'Admin - Transaksi Detail'
method: GET
url: '{{base_url}}/admin/transaksi/{{transaksi_id}}'
order: 13500
headers:
  - key: Accept
    value: 'text/html'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Transaksi detail loads", function() {
          pm.expect(pm.response.code).to.be.oneOf([200, 302, 404]);
      });
