$kind: http-request
name: 'Admin - Approve Edit Request'
method: POST
url: '{{base_url}}/admin/edit-requests/{{edit_request_id}}/approve'
order: 8000
headers:
  - key: Accept
    value: 'application/json'
  - key: X-CSRF-TOKEN
    value: '{{csrf_token}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Edit request approved", function() {
          pm.expect(pm.response.code).to.be.oneOf([200, 302, 404, 419]);
      });
