$kind: http-request
name: 'Waybot Clear History'
method: POST
url: '{{base_url}}/waybot/reset'
order: 4000
headers:
  - key: Accept
    value: 'application/json'
  - key: X-CSRF-TOKEN
    value: '{{csrf_token}}'
  - key: Content-Type
    value: 'application/json'
body:
  type: json
  content: |-
    {
      "session_token": "{{waybot_session_token}}"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("History cleared", function() {
          pm.expect(pm.response.code).to.be.oneOf([200, 204]);
      });
