$kind: http-request
name: 'Pemilik Edit Request List'
method: GET
url: '{{base_url}}/pemilik/edit-request'
order: 9000
headers:
  - key: Accept
    value: 'text/html'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Edit requests list loads", function() {
          pm.expect(pm.response.code).to.be.oneOf([200, 302]);
      });
