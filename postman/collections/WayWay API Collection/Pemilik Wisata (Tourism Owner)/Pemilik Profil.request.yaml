$kind: http-request
name: 'Pemilik Profil'
method: GET
url: '{{base_url}}/pemilik/profile'
order: 6000
headers:
  - key: Accept
    value: 'text/html'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Profil loads", function() {
          pm.expect(pm.response.code).to.be.oneOf([200, 302]);
      });
