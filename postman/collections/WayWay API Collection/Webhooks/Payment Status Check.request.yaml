$kind: http-request
name: 'Payment Status Check'
method: GET
url: '{{base_url}}/admin/transaksi'
order: 4000
headers:
  - key: Accept
    value: 'text/html'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Payment status returns 200, 302, or 403", function() {
          pm.expect(pm.response.code).to.be.oneOf([200, 302, 403, 404]);
      });
