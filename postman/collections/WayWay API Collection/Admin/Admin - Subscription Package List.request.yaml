$kind: http-request
name: 'Admin - Subscription Package List'
method: GET
url: '{{base_url}}/admin/travel-subscriptions/packages'
order: 12000
headers:
  - key: Accept
    value: 'text/html'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Subscription packages list loads", function() {
          pm.expect(pm.response.code).to.be.oneOf([200, 302]);
      });
